name: Deploy Kaseobot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build & push Container
        # Cloudflare Containers requires the Workers Paid plan.
        # On the free plan this step fails with "Unauthorized: ... Workers Paid plan";
        # continue-on-error keeps the Worker deploy below working regardless.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: containers build container-seomator --tag seomator-container:v1 --push

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          # --containers-rollout=none deploys the Worker and its Durable Object
          # binding without requiring the Containers entitlement.
          # Remove this flag after upgrading to Workers Paid to roll out the container.
          command: deploy --containers-rollout=none