version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "vitest"
          - "typescript"
          - "@cloudflare/*"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
    ignore:
      - dependency-name: "wrangler"
        versions: ["4.150.0"]  # pin until tested

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"