name = "kaseobot"
main = "src/index.ts"
compatibility_date = "2026-10-13"

[vars]
ALLOWED_TELEGRAM_USER_IDS = "7628415256"
MAX_AUDITS_PER_USER_PER_HOUR = "10"
MAX_CONCURRENT_AUDITS_PER_USER = "2"
AUDIT_TIMEOUT_MS = "300000"
GEO_MAX_PAGES = "5"
NVIDIA_KIMI_MODEL = "moonshotai/kimi-k3"
NVIDIA_KIMI_ENDPOINT = "https://integrate.api.nvidia.com/v1/chat/completions"
KIMI_TIMEOUT_MS = "60000"
MAX_FINDINGS_FOR_KIMI = "25"
MAX_EVIDENCE_LENGTH = "300"

[[d1_databases]]
binding = "DB"
database_name = "kaseobot-data"
database_id = "c1140596-3ca6-42d7-ab56-fadbc46c84d2"
migrations_dir = "migrations"

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "kaseobot-audit-jobs"

[[queues.consumers]]
queue = "kaseobot-audit-jobs"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "kaseobot-audit-dead-letter"

[[queues.consumers]]
queue = "kaseobot-audit-dead-letter"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3

# SEOmator audit container (Cloudflare Containers beta).
# Linked to the SeomatorContainer Durable Object; requests stub-fetch'ed to
# the SEOMATOR_CONTAINER binding are proxied to container port 3000.
[[containers]]
name = "seomator-container"
class_name = "SeomatorContainer"
image = "./container-seomator/Dockerfile"
max_instances = 1

[durable_objects]
bindings = [{ name = "SEOMATOR_CONTAINER", class_name = "SeomatorContainer" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeomatorContainer"]

[triggers]
crons = ["0 3 * * *"]